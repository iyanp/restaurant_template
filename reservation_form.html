<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width" initial-scale="1.0">
        <link rel="stylesheet" href="style.css">
    </head>

    <body class="iframe-body">

        <header class="reservation-page">
            <h3>Mag Reserba ng Mesa</h3>
            <p>Kukumpirmahin namin ang iyong booking sa pamamagitan ng email sa loob ng isang oras.</p>
        </header>
        <form class="booking-form">

            <div class="form-group">
                <label>Full name</label>
                <input type="text" id="#fullName" placeholder="e.g Juan Dela Cruz" required>
            </div>
            
            <div class="split-wrapper">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="#email" placeholder="e.g you@emaxple.com">
                </div>

                <div class="form-group">
                    <label>Phone</label>
                    <input type="tel" id="#phoneNum" placeholder="0912 345 6789" required>
                </div>
            </div>

            <div class="form-group">
                <label>Date</label>
                <input type="date" required>
            </div>

            <div class="form-group">
                <label>Time</label>
                <input type="time" required>
            </div>

            <div class="form-group">
                <label>Guest</label>
                <select required>
                    <option value="1">1 guest</option>
                    <option value="2">2 guest</option>
                    <option value="3">3 guest</option>
                    <option value="4">4 guest</option>
                </select>
            </div>

            <div class="form-group">
                <label>Request</label>
                <textarea type="text" rows="5" placeholder="Allergies, seating preferences etc."></textarea>
            </div>

            <button class="button-wrapper-one">Kumpirmahin</button>
        </form>
    </body>

</html>
